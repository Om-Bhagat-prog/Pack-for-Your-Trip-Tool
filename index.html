<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content = "width=device-width, initial-scale=1.0" />
        <title>Pack for Your Trip</title>
        <link rel="stylesheet" href="style.css" /> 
    </head>

    <body>
        <main class = "container">
            <section class = "hero">
                <h1>Pack for Your Trip</h1>
                <p>
                    Choose your trip details and get a simple packing list made for your travel plan.
                </p>
            </section>

            <section class="card">
                <h2>Trip Details</h2>

                <form id = "tripForm">
                    <label for="tripType">Trip Type</label>
                    <select id = "tripType">
                        <option value = ""> Choose a trip type</option>
                        <option value = "beach">Beach Trip</option>
                        <option value = "city">City Trip</option>
                        <option value="mountain">Mountain Trip</option>
                        <option value="camping">Camping Trip</option>
                        <option value="international">International Trip</option>
                    </select>

                    <label for="weather">Weather</label>
                    <select id="weather">
                        <option value="">Choose Weather</option>
                        <option value = "hot">Hot</option>
                        <option value = "cold">Cold</option>
                        <option value = "rainy">Rainy</option>
                        <option value = "mixed">Mixed</option>
                    </select>

                    <label for="days"> Number of Days</label>
                    <input type="number" id="days" min="1" max="30" placeholder = "Example: 5" />

                    <label for = "activity">Main Activity</label>
                    <select id = "activity">
                        <option value="">Choose activity</option>
                        <option value = "sightseeing">Sightseeing</option>
                        <option value = "hiking">Hiking</option>
                        <option value = "swimming">Swimming</option>
                        <option value = "business">Business Event</option>
                        <option value = "relaxing">Relaxing</option>
                    </select>

                    <button type="submit">Generate Packing List</button>
                </form>
            </section>

            <section class="card results">
                <h2>Your Packing List</h2>
                <div id="packingResults">
                    <p class = "empty-message">Your packing list will appear here.</p>
                </div>
            </section>
        </main>
    <script src = "script.js"></script>
    </body>
</html>
